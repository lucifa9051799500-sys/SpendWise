<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income - SpendWise</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Add Income</h1>

        <form action="/add-income" method="POST">

            <label for="title">Income Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Salary, Freelance"
                required
            >

            <label for="amount">Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                placeholder="Enter amount"
                required
            >

            <label for="income_date">Date</label>

            <input
                type="date"
                id="income_date"
                name="income_date"
                required
            >

            <button type="submit">Save Income</button>

        </form>

        <br>

        <div class="page-navigation">
            <a href="/dashboard">Back to Dashboard</a>
            <a href="/">Home</a>
        </div>

    </div>

</body>
</html>
