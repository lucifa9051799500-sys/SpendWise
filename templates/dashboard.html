<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - SpendWise</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            SpendWise
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <main class="dashboard-container">

        <h1>Welcome, {{ user_name }}!</h1>

        <p class="dashboard-subtitle">
            Manage your income and expenses easily.
        </p>

        <div class="dashboard-cards">

            <div class="dashboard-card">
                <h3>Total Income</h3>
                <p>₹0.00</p>
            </div>

            <div class="dashboard-card">
                <h3>Total Expense</h3>
                <p>₹0.00</p>
            </div>

            <div class="dashboard-card">
                <h3>Balance</h3>
                <p>₹0.00</p>
            </div>

        </div>

        <div class="dashboard-actions">

            <a href="/add-income" class="dashboard-button income-button">
                Add Income
            </a>

            <a href="/add-expense" class="dashboard-button expense-button">
                Add Expense
            </a>

            <a href="/" class="dashboard-button home-button">
                Go to Home
            </a>

            <a href="/logout" class="dashboard-button logout-button">
                Logout
            </a>

        </div>

    </main>

</body>
</html>
